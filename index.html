<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hola</title>

  <style>
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, system-ui;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;

      /* ===== GANTI NAMA FILE DI SINI ===== */
      background: url('gunung.png') no-repeat center center;
      background-size: cover;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.15);
      padding: 30px;
      border-radius: 16px;
      backdrop-filter: blur(6px);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    h1 {
      margin-bottom: 16px;
      font-size: 28px;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      width: 80%;
      text-align: center;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: rgba(255,255,255,0.3);
      color: #fff;
      font-weight: bold;
    }

    button:hover {
      background: rgba(255,255,255,0.5);
    }

    .error {
      color: red;
      margin-top: 12px;
      font-weight: bold;
      display: none;
    }
  </style>
</head>

<body>

  <div class="overlay"></div>

  <div class="container">
    <h1>BAHAGIA SELALU</h1>
    <input type="text" id="keywordInput" placeholder="Ketik di sini..." />
    <br>
    <button onclick="checkKeyword()">Enter</button>
    <p class="error" id="errorMsg"></p>
  </div>

  <script>
    const input = document.getElementById("keywordInput");
    const errorMsg = document.getElementById("errorMsg");

    function checkKeyword() {
      const value = input.value.trim();

      if (value === "sKasjJshjsn1834") { 
        window.location.href = "slideshow.html"; 
      } else {
        errorMsg.textContent = "TERIMAKASIH";
        errorMsg.style.display = "block";
        input.value = "";
        input.focus();
      }
    }

    input.addEventListener("keyup", function(event) {
      if (event.key === "Enter") {
        checkKeyword();
      }
    });
  </script>

</body>
</html>
